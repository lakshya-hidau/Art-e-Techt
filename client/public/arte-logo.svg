<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="artCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B82E43" />
      <stop offset="100%" stop-color="#9F2438" />
    </linearGradient>
    <linearGradient id="artGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C369" />
      <stop offset="100%" stop-color="#D6B45C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#B82E43" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Geometric Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#121315" stroke="#292A2C" stroke-width="2.5" />
  
  <!-- Subtle Arch Frame -->
  <path d="M 22 75 L 22 42 A 28 28 0 0 1 78 42 L 78 75" fill="none" stroke="url(#artGold)" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  
  <!-- Distinctive 'A' monogram stylized as an architectural apex / creative compass -->
  <path d="M 50 18 L 26 74 L 38 74 L 50 44 L 62 74 L 74 74 Z" fill="url(#artCrimson)" filter="url(#glow)" />
  
  <!-- Golden architectural crossbeam (the tech connector) -->
  <rect x="33" y="56" width="34" height="4.5" rx="2.25" fill="url(#artGold)" />
  
  <!-- Center focal node -->
  <circle cx="50" cy="44" r="3.5" fill="#F4F0E8" />
</svg>
