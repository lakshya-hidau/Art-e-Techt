name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          client/package-lock.json
          server/package-lock.json

    - name: Install server dependencies
      run: |
        cd server
        npm ci

    - name: Install client dependencies
      run: |
        cd client
        npm ci

    - name: Lint client code
      run: |
        cd client
        npm run lint

    - name: Run server tests
      run: |
        cd server
        npm test -- --run

    - name: Build client
      run: |
        cd client
        npm run build
      env:
        VITE_API_URL: ${{ vars.VITE_API_URL }}
        VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        VITE_LINKEDIN_CLIENT_ID: ${{ vars.VITE_LINKEDIN_CLIENT_ID }}
        VITE_LINKEDIN_REDIRECT_URI: ${{ vars.VITE_LINKEDIN_REDIRECT_URI }}
        VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Render (Staging)
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install client dependencies
      run: npm ci
      working-directory: client

    - name: Build production client
      run: npm run build
      working-directory: client
      env:
        VITE_API_URL: ${{ vars.VITE_API_URL }}
        VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
        VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
        VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
        VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        VITE_LINKEDIN_CLIENT_ID: ${{ vars.VITE_LINKEDIN_CLIENT_ID }}
        VITE_LINKEDIN_REDIRECT_URI: ${{ vars.VITE_LINKEDIN_REDIRECT_URI }}
        VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

    - name: Deploy to Render (Production)
      run: |
        curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK_PRODUCTION }}"

    - name: Deploy to Firebase (Production)
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}'
        channelId: live
        projectId: talentconnect-6e347
        target: art-e-techt-95db8